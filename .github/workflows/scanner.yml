# Daily setup scanner (steps 1–3 of the TradingView workflow), right after the close.
# Downloads 2 years of daily bars for every US stock over $700M, runs the screeners and the
# Momentum Setup Finder, updates the lists and writes setups/ (latest.json, README.md, TradingView
# import files). Settings: scanner/settings.json.
# Two UTC times so it runs at about 4:40 PM ET in summer (EDT) and winter (EST); a run before
# 4:20 PM ET, on a weekend, or after today was already processed skips itself.
# Run by hand: Actions -> Setup scanner -> Run workflow (backfill N rebuilds the lists over N days).
name: Setup scanner

on:
  schedule:
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild the lists from scratch over the last N trading days (0 = normal daily run)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet numba numpy pandas

      - name: Is there a new trading day to process?
        id: gate
        run: |
          python3 - <<'PY'
          import datetime, json, os, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          go = True
          if not manual:
              if now.weekday() >= 5 or (now.hour, now.minute) < (16, 20):
                  print("Before 4:20 PM ET or a weekend: nothing to do."); go = False
              elif os.path.exists("scanner/state.json") and json.load(open("scanner/state.json")).get("asof") == now.date().isoformat():
                  print("Today was already processed."); go = False
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"go={'yes' if go else 'no'}\n")
          PY

      - name: Download bars
        if: steps.gate.outputs.go == 'yes'
        run: python3 scanner/fetch.py /tmp/bars.json.gz

      - name: Scan
        if: steps.gate.outputs.go == 'yes'
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '0' }}
        run: |
          if [ "$BACKFILL" != "0" ]; then
            python3 scanner/run.py --bars /tmp/bars.json.gz --backfill "$BACKFILL"
          else
            python3 scanner/run.py --bars /tmp/bars.json.gz
          fi

      - name: Trend launches (launch days, their themes and the bases that follow)
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
          mkdir -p /tmp/rd
          git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
          git show origin/radar-data:themes.json > /tmp/rd/themes.json
          git show origin/radar-data:gradelog.json > /tmp/rd/gradelog.json || true
          git show origin/radar-data:live.json > /tmp/rd/live.json || true
          python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out setups/launch.json --backtest setups/launch_backtest.json --gradelog /tmp/rd/gradelog.json --live /tmp/rd/live.json

      - name: After-close heads-ups to the phone (tight under a buy point, retest held)
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 radar/eod_alerts.py setups/launch.json

      - name: Save today's 5-minute bars for the 21 / 50 EMA trigger test
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: python3 scanner/intraday.py /tmp/bars.json.gz

      - name: Commit results
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "close-snapshot-bot"
          git config user.email "close-snapshot-bot@users.noreply.github.com"
          git add scanner/state.json setups history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "setups $(TZ=America/New_York date +%F)"
            git pull --rebase --quiet origin main
            git push
          fi
