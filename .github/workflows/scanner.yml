# Daily setup scanner (steps 1–3 of the TradingView workflow), right after the close.
# Downloads 2 years of daily bars for every US stock over $700M, runs the screeners and the
# Momentum Setup Finder, updates the lists and writes setups/ (latest.json, README.md, TradingView
# import files). Settings: scanner/settings.json.
# Started at 4:25 PM ET by the day job (radar/day.py, right after its after-close refresh; the user, Nov 5 2026);
# the two UTC times (about 4:40 PM ET in summer and winter) are the backup. A scheduled or day-job run before
# 4:20 PM ET, on a weekend, or after today was already processed skips itself. The two early-morning times (about
# 3:30 / 4:30 AM ET in winter, 4:30 / 5:30 AM in summer) are the safety run (the user, Nov 6 2026: "it should be ready
# around 5 AM, new day everything new"): they scan the last close only when no evening run did.
# Run by hand: Actions -> Setup scanner -> Run workflow (backfill N rebuilds the lists over N days).
name: Setup scanner

on:
  schedule:
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild the lists from scratch over the last N trading days (0 = normal daily run)"
        default: "0"
      auto:
        description: "1 = started by the day job: the same checks as a scheduled run"
        default: "0"

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet numba numpy pandas

      - name: Is there a new trading day to process?
        id: gate
        env:
          AUTO: ${{ github.event.inputs.auto || '0' }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and os.environ.get("AUTO", "0") != "1"
          go = True
          if not manual:
              asof = json.load(open("scanner/state.json")).get("asof") if os.path.exists("scanner/state.json") else None
              prev = now.date() - datetime.timedelta(days=1)          # the last weekday's close (a holiday only costs a no-op run)
              while prev.weekday() >= 5:
                  prev -= datetime.timedelta(days=1)
              if now.weekday() >= 5:
                  print("A weekend: nothing to do."); go = False
              elif (now.hour, now.minute) < (9, 0):                   # the early-morning safety run
                  if asof and asof >= prev.isoformat():
                      print(f"The last close ({asof}) was already scanned."); go = False
                  else:
                      print(f"Safety run: the last close wasn't scanned (last {asof}).")
              elif (now.hour, now.minute) < (16, 20):
                  print("Before 4:20 PM ET: nothing to do."); go = False
              elif asof == now.date().isoformat():
                  print("Today was already processed."); go = False
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"go={'yes' if go else 'no'}\n")
          PY

      - name: Download bars
        if: steps.gate.outputs.go == 'yes'
        run: python3 scanner/fetch.py /tmp/bars.json.gz

      - name: Scan
        if: steps.gate.outputs.go == 'yes'
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '0' }}
        run: |
          if [ "$BACKFILL" != "0" ]; then
            python3 scanner/run.py --bars /tmp/bars.json.gz --backfill "$BACKFILL"
          else
            python3 scanner/run.py --bars /tmp/bars.json.gz
          fi

      - name: Trend launches (launch days, their themes and the bases that follow)
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
          mkdir -p /tmp/rd
          git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
          git show origin/radar-data:themes.json > /tmp/rd/themes.json
          git show origin/radar-data:gradelog.json > /tmp/rd/gradelog.json || true
          git show origin/radar-data:live.json > /tmp/rd/live.json || true
          python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out setups/launch.json --backtest setups/launch_backtest.json --gradelog /tmp/rd/gradelog.json --live /tmp/rd/live.json --picks setups/picks.json --watchlist setups/latest.json

      - name: After-close heads-ups to the phone (tight under a buy point, retest held)
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 radar/eod_alerts.py setups/launch.json

      - name: Save today's 5-minute bars for the 21 / 50 EMA trigger test
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: python3 scanner/intraday.py /tmp/bars.json.gz

      - name: Commit results
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "close-snapshot-bot"
          git config user.email "close-snapshot-bot@users.noreply.github.com"
          git add scanner/state.json setups history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "setups $(TZ=America/New_York date +%F)"
            git pull --rebase -X theirs --quiet origin main     # a Follow-button rebuild meanwhile: this scan's launches win (they include the picks)
            git push
          fi
