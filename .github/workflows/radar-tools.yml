# One-off checks for Theme & Group Radar (run by hand; doesn't wait for the Radar day job).
name: Radar tools
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Command to run (see radar/)"
        default: "probe"
permissions:
  contents: write
  actions: write
concurrency:
  group: radar-tools
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ inputs.cmd }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          if [ "${{ inputs.cmd }}" = "probe" ]; then
            python3 radar/probe_vol.py /tmp/probe_vol.json NVDA AMD AAPL MU TSLA PBF CRWD XNCR AAOI LITE SNDK ICHR UCTT DK ARIS RKLB HOOD PLTR COHR IREN
            python3 radar/publish.py "volume probe" /tmp/probe_vol.json
          fi
          if [ "${{ inputs.cmd }}" = "volprofile" ]; then python3 radar/day.py volprofile; fi
          if [ "${{ inputs.cmd }}" = "premarket" ]; then python3 radar/day.py premarket; fi
          if [ "${{ inputs.cmd }}" = "etfs" ]; then python3 radar/day.py etfs; fi
          if [ "${{ inputs.cmd }}" = "trades" ]; then python3 radar/probe_trades.py /tmp/probe_trades.json AMD INTC MU SNDK COHR SMCI WDC PLTR && python3 radar/publish.py "trades probe" /tmp/probe_trades.json; fi
          if [ "${{ inputs.cmd }}" = "rvsrc" ]; then python3 radar/probe_rvsrc.py /tmp/probe_rvsrc.json SNDK LITE MXL INTC AMD && python3 radar/publish.py "rvol source probe" /tmp/probe_rvsrc.json; fi
          if [ "${{ inputs.cmd }}" = "rvvar" ]; then python3 radar/probe_rvvar.py /tmp/probe_rvvar.json SNDK LITE MXL INTC AMD && python3 radar/publish.py "rvol variants probe" /tmp/probe_rvvar.json; fi
          if [ "${{ inputs.cmd }}" = "rvday" ]; then python3 radar/probe_rvday.py /tmp/probe_rvday.json SNDK LITE MXL INTC AMD NVDA CRWD AAPL TSLA PLTR MU COHR && python3 radar/publish.py "rvol replay" /tmp/probe_rvday.json; fi
          if [ "${{ inputs.cmd }}" = "rvlive" ]; then python3 radar/probe_rvlive.py /tmp/probe_rvlive.json SNDK LITE MXL INTC AMD NVDA CRWD AAPL TSLA PLTR MU COHR ORCL JPM XOM ANET VRT GE && python3 radar/publish.py "rvol live check" /tmp/probe_rvlive.json; fi
          if [ "${{ inputs.cmd }}" = "alpplan" ]; then python3 radar/probe_alpplan.py /tmp/probe_alpplan.json && python3 radar/publish.py "alpaca plan check" /tmp/probe_alpplan.json; fi
          if [ "${{ inputs.cmd }}" = "launch" ]; then
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json && { git show origin/radar-data:gradelog.json > /tmp/rd/gradelog.json || true; } && { git show origin/radar-data:live.json > /tmp/rd/live.json || true; }
            python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out setups/launch.json --backtest setups/launch_backtest.json --gradelog /tmp/rd/gradelog.json --live /tmp/rd/live.json --picks setups/picks.json
            git add setups/launch.json setups/launch_backtest.json
            git diff --cached --quiet || { git commit -q -m "launches $(TZ=America/New_York date +%F)"; git pull -q --rebase origin main; git push -q; }
          fi
          if [ "${{ inputs.cmd }}" = "setups3" ]; then
            # the 2-year check of the new 3-SETUPS (scanner/probe_setups3.py) -> radar-data probe_setups3.json
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json
            python3 scanner/probe_setups3.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/probe_setups3.json || true
            python3 radar/publish.py "3-SETUPS check" /tmp/probe_setups3.json
          fi
          if [ "${{ inputs.cmd }}" = "setupsdry" ]; then
            # the new 3-SETUPS on tonight's Watchlist lists (not saved to main): published as radar-data setups_dry.json
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd /tmp/wl/history && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json
            cp setups/latest.json /tmp/wl/latest.json && cp setups/launch.json /tmp/launch_dry.json
            python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/launch_dry.json --picks setups/picks.json --watchlist /tmp/wl/latest.json
            cp /tmp/wl/latest.json /tmp/setups_dry.json && python3 radar/publish.py "setups dry run" /tmp/setups_dry.json /tmp/launch_dry.json
          fi
          case "$CMD" in launchdry\ *)
            # the launch build with test picks (not saved to main): python3 -c writes them added at this time yesterday
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json
            python3 -c "import json,sys,datetime; t=(datetime.datetime.now()-datetime.timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%S'); json.dump({'picks': {s: {'added': t} for s in sys.argv[1:]}}, open('/tmp/picks_dry.json','w'))" ${CMD#launchdry }
            python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/launch_dry.json --picks /tmp/picks_dry.json
            python3 radar/publish.py "launch dry run" /tmp/launch_dry.json;;
          esac
          if [ "${{ inputs.cmd }}" = "groupsdry" ]; then
            # the portal build (pipeline.py) + the launch build on this branch, not published live: radar-data
            # stocks_dry.json, themes_dry.json, groups_dry.json, launch_dry.json
            pip install --quiet numba numpy pandas
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/work /tmp/out /tmp/rd && { git show origin/radar-data:profiles.json > /tmp/work/profiles.json || true; }
            python3 -I radar/pipeline.py /tmp/work /tmp/out "$GITHUB_REPOSITORY" | tail -c 600
            python3 scanner/fetch.py /tmp/bars.json.gz
            { git show origin/radar-data:gradelog.json > /tmp/rd/gradelog.json || true; } && { git show origin/radar-data:live.json > /tmp/rd/live.json || true; }
            cp setups/launch.json /tmp/launch_dry.json
            python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/out/stocks.json --out /tmp/launch_dry.json --gradelog /tmp/rd/gradelog.json --live /tmp/rd/live.json --picks setups/picks.json
            cp /tmp/out/stocks.json /tmp/stocks_dry.json && cp /tmp/out/themes.json /tmp/themes_dry.json && cp /tmp/out/groups.json /tmp/groups_dry.json
            python3 radar/publish.py "groups dry run" /tmp/stocks_dry.json /tmp/themes_dry.json /tmp/groups_dry.json /tmp/launch_dry.json
          fi
          if [ "${{ inputs.cmd }}" = "launchbt" ]; then
            # the launch build AND the History test on this branch, not saved to main: radar-data launch_dry.json + launch_bt_dry.json
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json && { git show origin/radar-data:gradelog.json > /tmp/rd/gradelog.json || true; } && { git show origin/radar-data:live.json > /tmp/rd/live.json || true; }
            cp setups/launch.json /tmp/launch_dry.json
            python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/launch_dry.json --backtest /tmp/launch_bt_dry.json --gradelog /tmp/rd/gradelog.json --live /tmp/rd/live.json --picks setups/picks.json
            python3 radar/publish.py "launch + history dry run" /tmp/launch_dry.json /tmp/launch_bt_dry.json
          fi
          if [ "${{ inputs.cmd }}" = "levels" ]; then
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json
            python3 scanner/probe_levels.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/probe_levels.json
            python3 radar/publish.py "levels test" /tmp/probe_levels.json
          fi
          if [ "${{ inputs.cmd }}" = "catalyst" ]; then
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json
            python3 scanner/probe_catalyst.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/probe_catalyst.json || true
            python3 radar/publish.py "catalyst launch test" /tmp/probe_catalyst.json
          fi
          if [ "${{ inputs.cmd }}" = "gapstudy" ]; then
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json && git show origin/radar-data:volprofile.json > /tmp/rd/volprofile.json
            python3 scanner/probe_gaps.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --volprofile /tmp/rd/volprofile.json --out /tmp/probe_gaps.json
            python3 radar/publish.py "gap study" /tmp/probe_gaps.json
          fi
          if [ "${{ inputs.cmd }}" = "trendnow" ]; then
            # the Trend at the last close for every stock (the nightly build on this branch, run by hand; only its Trend
            # fields are published, as radar-data trend.json; stocks.json is not touched); the portal uses it until the
            # nightly build carries the Trend itself
            python3 -I radar/pipeline.py /tmp/pwork /tmp/pout "$GITHUB_REPOSITORY" | tail -3
            python3 -c "import json; d=json.load(open('/tmp/pout/stocks.json')); b=json.load(open('/tmp/pout/build.json')); b=b[0] if isinstance(b,list) else b; json.dump({'asof': b.get('asof'), 'rows': {r['symbol']: [r.get('trend'), r.get('trend_days'), r.get('tr')] for r in d if r.get('trend') is not None}}, open('/tmp/trend.json','w'), separators=(',',':'))"
            python3 radar/publish.py "trend $(TZ=America/New_York date '+%F %H:%M')" /tmp/trend.json
          fi
          if [ "${{ inputs.cmd }}" = "pipedry" ]; then
            # the nightly build on this branch, NOT published as stocks.json: radar-data stocks_dry.json (the Trend check)
            python3 -I radar/pipeline.py /tmp/pwork /tmp/pout "$GITHUB_REPOSITORY" | tail -5
            cp /tmp/pout/stocks.json /tmp/stocks_dry.json && python3 radar/publish.py "pipeline dry run" /tmp/stocks_dry.json
          fi
          if [ "${{ inputs.cmd }}" = "earnings" ]; then
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
            git show origin/radar-data:earnings.json > /tmp/rd/earnings_prev.json 2>/dev/null || echo '{}' > /tmp/rd/earnings_prev.json
            python3 radar/earnings.py /tmp/rd/stocks.json /tmp/rd/earnings_prev.json /tmp/earnings.json && python3 radar/publish.py "earnings (by hand)" /tmp/earnings.json
          fi
          if [ "${{ inputs.cmd }}" = "earntest" ]; then   # a test branch's Earnings build -> radar-data earnings_test.json (the portal doesn't read it)
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
            git show origin/radar-data:earnings.json > /tmp/rd/earnings_prev.json 2>/dev/null || echo '{}' > /tmp/rd/earnings_prev.json
            python3 radar/earnings.py /tmp/rd/stocks.json /tmp/rd/earnings_prev.json /tmp/earnings_test.json && python3 radar/publish.py "earnings test build" /tmp/earnings_test.json
          fi
          if [ "${{ inputs.cmd }}" = "codegrade" ]; then   # the code grader's backtest (test/codegrade) -> radar-data probe_codegrade.json
            pip install --quiet numba numpy pandas
            python3 scanner/fetch.py /tmp/bars.json.gz
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json && git show origin/radar-data:themes.json > /tmp/rd/themes.json
            python3 scanner/probe_codegrade.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out /tmp/probe_codegrade.json --minutes 42
            python3 radar/publish.py "code grader backtest" /tmp/probe_codegrade.json
          fi
          case "$CMD" in pmnews*)   # the 8:05 / 8:35 news run as of a time ("pmnews 2026-11-06T08:05") -> pmnews_test.json
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd /tmp/pm && for f in stocks earnings themes trend; do git show origin/radar-data:$f.json > /tmp/rd/$f.json; done
            git show origin/radar-data:premarket_live.json > /tmp/rd/pmlive.json 2>/dev/null || true
            echo '[]' > /tmp/pm/claude_premarket.json
            python3 radar/premarket_build.py prepare premarket/latest.json /tmp/rd/stocks.json /tmp/pm 8 4 --live=/tmp/rd/pmlive.json
            A=${CMD#pmnews}; A=${A# }
            python3 radar/codegrade.py news /tmp/pm/rows.json /tmp/rd/stocks.json /tmp/rd/earnings.json /tmp/pmnews_test.json ${A:+--asof=$A}
            python3 radar/publish.py "pre-market news test" /tmp/pmnews_test.json;;
          esac
          case "$CMD" in codelive*)   # the code grader on today's whole pre-market list as of a time ("codelive 2026-11-04T08:57") -> codegrade_test.json
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd /tmp/pm && for f in stocks earnings themes trend; do git show origin/radar-data:$f.json > /tmp/rd/$f.json; done
            git show origin/radar-data:premarket_live.json > /tmp/rd/pmlive.json 2>/dev/null || true
            git show origin/radar-data:premarket.json > /tmp/pm/claude_premarket.json 2>/dev/null || echo '[]' > /tmp/pm/claude_premarket.json
            python3 radar/premarket_build.py prepare premarket/latest.json /tmp/rd/stocks.json /tmp/pm 8 4 --live=/tmp/rd/pmlive.json
            A=${CMD#codelive}; A=${A# }
            python3 radar/codegrade.py live /tmp/pm/rows.json /tmp/rd/stocks.json /tmp/rd/earnings.json /tmp/codegrade_test.json ${A:+--asof=$A}
            python3 radar/publish.py "code grader test" /tmp/codegrade_test.json;;
          esac
          case "$CMD" in morning*)   # the morning breakout alert replayed on today's 1-minute charts ("morning FLY VSAT ...") -> probe_morning.json; before 4:06 PM
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && for f in stocks earnings volprofile; do git show origin/radar-data:$f.json > /tmp/rd/$f.json; done
            git show origin/main:alerts/morning.json > /tmp/rd/morning.json 2>/dev/null || git show HEAD:alerts/morning.json > /tmp/rd/morning.json 2>/dev/null || echo '{}' > /tmp/rd/morning.json
            A=${CMD#morning}; A=${A# }
            python3 radar/probe_morning.py /tmp/rd/stocks.json /tmp/rd/volprofile.json /tmp/rd/earnings.json /tmp/probe_morning.json --settings=/tmp/rd/morning.json $A
            python3 radar/publish.py "morning breakout replay" /tmp/probe_morning.json;;
          esac
          if [ "${{ inputs.cmd }}" = "runners" ]; then   # today's runners vs their 21-day closing high (test/codegrade) -> probe_runners.json
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
            python3 scanner/probe_runners.py /tmp/rd/stocks.json /tmp/probe_runners.json 8 && python3 radar/publish.py "runners vs the 21-day high" /tmp/probe_runners.json
          fi
          case "$CMD" in news\ *) python3 radar/probe_news.py /tmp/probe_news.json ${CMD#news } && python3 radar/publish.py "news probe" /tmp/probe_news.json;; esac   # "news FROM TO SYM ..." (Alpaca / Yahoo headlines)
          case "$CMD" in reltext*) git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data && git show origin/radar-data:earnings.json > /tmp/earn_now.json && python3 radar/probe_reltext.py /tmp/earn_now.json /tmp/probe_reltext.json ${CMD#reltext} && python3 radar/publish.py "earnings release texts" /tmp/probe_reltext.json;; esac
          case "$CMD" in earnprobe\ *) python3 radar/probe_earnings.py /tmp/probe_earnings.json ${CMD#earnprobe } && python3 radar/publish.py "earnings source check" /tmp/probe_earnings.json;; esac
          case "$CMD" in long\ *) python3 radar/probe_long.py /tmp/long_bars.json ${CMD#long } && python3 radar/publish.py "long history" /tmp/long_bars.json;; esac
          case "$CMD" in replay\ *) python3 radar/probe_replay.py /tmp/probe_replay.json ${CMD#replay } && python3 radar/publish.py "alert replay" /tmp/probe_replay.json;; esac
          if [ "${{ inputs.cmd }}" = "alerttest" ]; then
            if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not set"; exit 1; fi
            curl -s -H "Title: Radar alerts are on" -H "Tags: white_check_mark" -d "Test from your Theme & Group Radar. Launch, power-day and breakout alerts will arrive here during market hours." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null && echo sent
          fi
          if [ "${{ inputs.cmd }}" = "eod" ]; then python3 radar/probe_eod.py /tmp/probe_eod.json SNDK LITE MXL INTC AMD NVDA CRWD && python3 radar/publish.py "eod rvol probe" /tmp/probe_eod.json; fi
          if [ "${{ inputs.cmd }}" = "pmvol" ]; then python3 radar/probe_pmvol.py /tmp/probe_pmvol.json INTC SMCI MU AXTI COHR AMD WDC SNDK PLTR LITE && python3 radar/publish.py "pm volume probe" /tmp/probe_pmvol.json; fi
          if [ "${{ inputs.cmd }}" = "revenue" ]; then
            git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            git show origin/radar-data:themes.json > /tmp/themes.json
            python3 radar/revenue.py /tmp/themes.json /tmp/revenue.json && python3 radar/publish.py "revenue" /tmp/revenue.json
          fi
          if [ "${{ inputs.cmd }}" = "restart-day" ]; then
            for id in $(gh run list --workflow radar-day.yml --status in_progress --json databaseId -q '.[].databaseId'); do gh run cancel $id; done
            sleep 20; gh workflow run radar-day.yml --ref main -f mode=day
          fi
          if [ "${{ inputs.cmd }}" = "alpaca" ]; then python3 radar/probe_alpaca.py /tmp/probe_alpaca.json AAPL,NVDA,CRWD,CIEN,TSLA,BE,AAOI,MU,AMD,PLTR && python3 radar/publish.py "alpaca probe" /tmp/probe_alpaca.json; fi
          if [ "${{ inputs.cmd }}" = "rvol" ]; then python3 radar/probe_rvol.py /tmp/probe_rvol.json CRWD TSLA CIEN BE AAOI NVDA && python3 radar/publish.py "rvol probe" /tmp/probe_rvol.json; fi
