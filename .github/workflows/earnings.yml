# The Earnings tab: this week's reports for the stocks that pass your rules, results, guidance and the read
# (radar/earnings.py -> radar-data earnings.json). No Claude: Nasdaq's calendar, Yahoo, the SEC press releases.
# Mornings: from about 7:10 to 8:55 AM ET on weekdays (final by 9:00); evenings: after the close for the after-close
# reports and the next days' calendar; Sunday evening: the new week. Both EDT and EST lines run; a run outside its
# window exits at once.
name: Earnings

on:
  schedule:
    - cron: "10,30,45,55 11,12,13 * * 1-5"   # mornings (EDT 7:10-9:55 / EST 6:10-8:55; the script keeps 7:00-9:00 ET)
    - cron: "20 13,14 * * 1-5"               # 9:20 AM ET (EDT / EST): a report out before the open whose filing came late
    - cron: "0 14,15,16,17,18,19 * * 1-5"    # 10:00, 12:00 and 2:00 PM ET (and the hours between): the same, through the session
    - cron: "50 20,21 * * 1-5"               # 4:50 PM ET (EDT / EST)
    - cron: "30 22,23 * * 1-5"               # 6:30 PM ET
    - cron: "30 0,1 * * 2-6"                 # 8:30 PM ET
    - cron: "0 22,23 * * 0"                  # Sunday 6 PM ET: the new week
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build earnings.json
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          H=$(TZ=America/New_York date +%H); M=$(TZ=America/New_York date +%M); D=$(TZ=America/New_York date +%u)
          T=$((10#$H * 60 + 10#$M))
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # 7:00 AM-3:05 PM (the morning runs, then the late-filing checks), evenings 4:45-9:30 PM on weekdays; Sunday evening
            ok=0
            if [ "$D" -le 5 ] && (( (T >= 420 && T <= 905) || (T >= 1005 && T <= 1290) )); then ok=1; fi
            if [ "$D" = 7 ] && (( T >= 1020 )); then ok=1; fi
            if [ $ok = 0 ]; then echo "outside the Earnings windows ($H:$M ET): nothing to do"; exit 0; fi
          fi
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
          mkdir -p /tmp/rd && git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
          git show origin/radar-data:earnings.json > /tmp/rd/earnings_prev.json 2>/dev/null || echo '{}' > /tmp/rd/earnings_prev.json
          git show origin/radar-data:pmnews.json > /tmp/rd/pmnews.json 2>/dev/null || echo '{}' > /tmp/rd/pmnews.json
          python3 radar/earnings.py /tmp/rd/stocks.json /tmp/rd/earnings_prev.json /tmp/earnings.json /tmp/rd/pmnews.json
          python3 radar/publish.py "earnings $(TZ=America/New_York date '+%F %H:%M')" /tmp/earnings.json
