# Your picks: the portal's Follow button (Watchlist tab) saves setups/picks.json; this rebuilds the Launches list
# with them right away, so they show on the Launches tab and the live job alerts on them within minutes, instead of
# after the evening scan (which includes them too). Remove (Launches tab) works the same way.
name: Follow picks

on:
  push:
    branches: [main]
    paths: [setups/picks.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: picks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Only a TREND removal? (the TREND list is the portal's own; nothing to rebuild)
        id: gate
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          go = True
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              old = subprocess.run(["git", "show", "HEAD~1:setups/picks.json"], capture_output=True, text=True)
              try:
                  a, b = json.loads(old.stdout), json.load(open("setups/picks.json"))
                  a.pop("removed_trend", None); b.pop("removed_trend", None)
                  go = a != b
              except Exception:
                  go = True
          print("rebuild" if go else "only a TREND removal: no Launches rebuild")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"go={'yes' if go else 'no'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.12"

      - name: Rebuild the Launches list with your picks
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          # the evening scan rebuilds the list too: let it finish, then build on top of it with the latest picks
          while [ "$(gh run list --workflow scanner.yml --status in_progress --json databaseId -q length)" != "0" ]; do
            echo "waiting for the evening scan"; sleep 30
          done
          git pull -q origin main
          pip install --quiet numba numpy pandas
          python3 scanner/fetch.py /tmp/bars.json.gz
          git fetch -q --depth 1 origin +refs/heads/radar-data:refs/remotes/origin/radar-data
          mkdir -p /tmp/rd
          git show origin/radar-data:stocks.json > /tmp/rd/stocks.json
          git show origin/radar-data:themes.json > /tmp/rd/themes.json
          git show origin/radar-data:gradelog.json > /tmp/rd/gradelog.json || true
          git show origin/radar-data:live.json > /tmp/rd/live.json || true
          # the guard (the user, Nov 4 2026): never replace the list with an older close. In the evening Yahoo rewrites
          # the day's bar and can serve bars without it (Nov 3 2026, 8:56 and 9:10 PM: a Nov 2 list replaced the Nov 3 one)
          OLD_DATE=$(python3 -c "import json; print(json.load(open('setups/launch.json')).get('date', ''))" 2>/dev/null || echo "")
          python3 scanner/launch.py --bars /tmp/bars.json.gz --stocks /tmp/rd/stocks.json --out setups/launch.json --gradelog /tmp/rd/gradelog.json --live /tmp/rd/live.json --picks setups/picks.json
          NEW_DATE=$(python3 -c "import json; print(json.load(open('setups/launch.json')).get('date', ''))")
          if [ -n "$OLD_DATE" ] && [[ "$NEW_DATE" < "$OLD_DATE" ]]; then
            echo "GUARD: the rebuild is of the $NEW_DATE close, older than the list on the portal ($OLD_DATE): not saved."
            echo "Your picks / removals are in setups/picks.json; the next evening scan (or a later Follow picks run) includes them."
            git checkout -- setups/launch.json
            exit 0
          fi
          python3 -c "import json; d = json.load(open('setups/launch.json')); print('picks on the list:', ' '.join(r['symbol'] for r in d['launches'] if r.get('pick')) or '-')"
          git add setups/launch.json
          git diff --cached --quiet && exit 0
          git commit -q -m "launches: your picks $(TZ=America/New_York date '+%F %H:%M')"
          for i in 1 2 3; do
            if git pull -q --rebase origin main; then
              git push -q && exit 0
            else
              git rebase --abort || true
              echo "the launches were rebuilt meanwhile: run this again (Actions -> Follow picks -> Run workflow)"; exit 1
            fi
            sleep 5
          done
          exit 1
