# Saves 5-minute bars (regular hours) for the stock-days listed in history/intraday_request.json
# ({"SYM": ["2026-09-02", ...]}) into history/intraday_5m.json.gz. Used to test the intraday
# triggers (21 / 50 EMA pullbacks) on real charts. Yahoo keeps about 60 days of 5-minute bars.
# Run it by hand: Actions -> Intraday bars -> Run workflow.
name: Intraday bars

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Save 5-minute bars
        run: |
          python3 - <<'PY'
          import concurrent.futures as cf, datetime, gzip, json, os, sys, time, urllib.error, urllib.request, zoneinfo
          NY = zoneinfo.ZoneInfo("America/New_York")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
               "Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9"}
          req = json.load(open("history/intraday_request.json"))
          print(len(req), "symbols requested")

          def bars(item):
              sym, days = item
              want = set(days)
              url = "https://query1.finance.yahoo.com/v8/finance/chart/" + sym.replace("/", "-").replace(".", "-") + "?range=60d&interval=5m"
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30) as r:
                          res = json.load(r)["chart"]["result"][0]
                      q = res["indicators"]["quote"][0]
                      out = {}
                      for t, o, h, l, c, v in zip(res.get("timestamp") or [], q.get("open") or [], q.get("high") or [],
                                                  q.get("low") or [], q.get("close") or [], q.get("volume") or []):
                          if None in (o, h, l, c):
                              continue
                          dt = datetime.datetime.fromtimestamp(t, NY)
                          d = dt.date().isoformat()
                          if d in want:
                              out.setdefault(d, []).append([dt.strftime("%H:%M"), round(o, 4), round(h, 4), round(l, 4), round(c, 4), int(v or 0)])
                      return sym, out
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return sym, None
                      time.sleep(4 * (attempt + 1))
                  except Exception:
                      time.sleep(4 * (attempt + 1))
              return sym, None

          data = {}
          with cf.ThreadPoolExecutor(10) as pool:
              for sym, b in pool.map(bars, req.items()):
                  if b:
                      data[sym] = b
          n = sum(len(v) for v in data.values())
          print(len(data), "symbols,", n, "stock-days saved")
          if len(data) < 0.8 * len(req):
              sys.exit(f"only {len(data)} of {len(req)} came back, not saving")
          with gzip.open("history/intraday_5m.json.gz", "wt") as f:
              json.dump({"saved_at": datetime.datetime.now(NY).isoformat(timespec="seconds"),
                         "fields": ["time", "open", "high", "low", "close", "volume"], "bars": data}, f, separators=(",", ":"))
          print("size MB", round(os.path.getsize("history/intraday_5m.json.gz") / 1e6, 1))
          PY

      - name: Commit bars
        run: |
          git config user.name "close-snapshot-bot"
          git config user.email "close-snapshot-bot@users.noreply.github.com"
          git add -A history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "intraday bars $(TZ=America/New_York date +%F)"
            git push
          fi
