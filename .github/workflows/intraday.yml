# Saves intraday bars (regular hours) for the stock-days listed in a request file
# ({"SYM": ["2026-09-02", ...]}) into an output file. Used to test the intraday triggers
# (21 / 50 EMA pullbacks, coils) on real charts. Yahoo keeps about 60 days of 2- and 5-minute bars.
# Run it by hand: Actions -> Intraday bars -> Run workflow.
name: Intraday bars

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Request file"
        default: "history/intraday_request.json"
      interval:
        description: "Bar size (2m or 5m)"
        default: "5m"
      out:
        description: "Output file"
        default: "history/intraday_5m.json.gz"
      range:
        description: "How far back (Yahoo keeps about 60 days of 2m / 5m bars)"
        default: "60d"

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Save intraday bars
        env:
          REQ: ${{ github.event.inputs.request || 'history/intraday_request.json' }}
          IVL: ${{ github.event.inputs.interval || '5m' }}
          OUT: ${{ github.event.inputs.out || 'history/intraday_5m.json.gz' }}
          RNG: ${{ github.event.inputs.range || '60d' }}
        run: |
          python3 - <<'PY'
          import concurrent.futures as cf, datetime, gzip, json, os, sys, time, urllib.error, urllib.request, zoneinfo
          NY = zoneinfo.ZoneInfo("America/New_York")
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
               "Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9"}
          req = json.load(open(os.environ["REQ"]))
          print(len(req), "symbols requested")

          errors = {}

          def bars(item):
              sym, days = item
              want = set(days)
              url = "https://query1.finance.yahoo.com/v8/finance/chart/" + sym.replace("/", "-").replace(".", "-") + "?range=" + os.environ["RNG"] + "&interval=" + os.environ["IVL"]
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=30) as r:
                          res = json.load(r)["chart"]["result"][0]
                      q = res["indicators"]["quote"][0]
                      out = {}
                      for t, o, h, l, c, v in zip(res.get("timestamp") or [], q.get("open") or [], q.get("high") or [],
                                                  q.get("low") or [], q.get("close") or [], q.get("volume") or []):
                          if None in (o, h, l, c):
                              continue
                          dt = datetime.datetime.fromtimestamp(t, NY)
                          d = dt.date().isoformat()
                          if d in want:
                              out.setdefault(d, []).append([dt.strftime("%H:%M"), round(o, 4), round(h, 4), round(l, 4), round(c, 4), int(v or 0)])
                      return sym, out
                  except urllib.error.HTTPError as e:
                      body = ""
                      try:
                          body = e.read().decode()[:300]
                      except Exception:
                          pass
                      errors[sym] = f"HTTP {e.code} {body}"
                      if e.code in (404, 400, 422):
                          return sym, None
                      time.sleep(4 * (attempt + 1))
                  except Exception as e:
                      errors[sym] = repr(e)[:300]
                      time.sleep(4 * (attempt + 1))
              return sym, None

          data = {}
          with cf.ThreadPoolExecutor(10) as pool:
              for sym, b in pool.map(bars, req.items()):
                  if b:
                      data[sym] = b
          n = sum(len(v) for v in data.values())
          print(len(data), "symbols,", n, "stock-days saved", flush=True)
          if len(data) < 0.8 * len(req):
              print(f"only {len(data)} of {len(req)} came back")
          with gzip.open(os.environ["OUT"], "wt") as f:
              json.dump({"saved_at": datetime.datetime.now(NY).isoformat(timespec="seconds"), "requested": len(req),
                         "errors": dict(list(errors.items())[:20]),
                         "fields": ["time", "open", "high", "low", "close", "volume"], "bars": data}, f, separators=(",", ":"))
          print("size MB", round(os.path.getsize(os.environ["OUT"]) / 1e6, 1))
          PY

      - name: Commit bars
        run: |
          git config user.name "close-snapshot-bot"
          git config user.email "close-snapshot-bot@users.noreply.github.com"
          git add -A history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "intraday bars $(TZ=America/New_York date +%F)"
            git push
          fi
